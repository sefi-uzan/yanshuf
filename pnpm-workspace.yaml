packages:
  - "apps/*"
  - "packages/*"
# electron-forge requires a hoisted node_modules. pnpm 11 no longer reads pnpm
# settings from .npmrc, so this has to live here.
nodeLinker: hoisted
allowBuilds:
  electron-winstaller: true
  esbuild: true
  fs-xattr: true
  macos-alias: true
  sharp: true
  unrs-resolver: true
