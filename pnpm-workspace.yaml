packages:
  - "apps/*"
  - "packages/*"
# electron-forge requires a hoisted node_modules. pnpm 11 no longer reads pnpm
# settings from .npmrc, so this has to live here.
nodeLinker: hoisted
# @electron/rebuild pulls @electron/node-gyp from a git tarball.
blockExoticSubdeps: false
allowBuilds:
  electron-winstaller: true
  esbuild: true
  fs-xattr: true
  macos-alias: true
  sharp: true
  unrs-resolver: true
# Pin patched transitive versions until upstreams (next, mcp sdk, http-mitm-proxy) bump.
overrides:
  fast-uri: ">=3.1.4"
  hono: ">=4.12.27"
  "@hono/node-server": ">=2.0.5"
  "brace-expansion@<1.1.18": "1.1.18"
  "ip-address": ">=10.3.1"
  "postcss@<8.5.18": "8.5.18"
  sharp: ">=0.35.0"
  "uuid@<11.1.1": "11.1.1"
minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.66.0'
  - '@typescript-eslint/parser@8.66.0'
  - '@typescript-eslint/project-service@8.66.0'
  - '@typescript-eslint/scope-manager@8.66.0'
  - '@typescript-eslint/tsconfig-utils@8.66.0'
  - '@typescript-eslint/type-utils@8.66.0'
  - '@typescript-eslint/types@8.66.0'
  - '@typescript-eslint/typescript-estree@8.66.0'
  - '@typescript-eslint/utils@8.66.0'
  - '@typescript-eslint/visitor-keys@8.66.0'
  - typescript-eslint@8.66.0
