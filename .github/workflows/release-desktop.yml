name: Release Desktop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run audit
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  release:
    needs: preflight
    runs-on: macos-latest
    strategy:
      # Both architectures attach to the same GitHub release, so build them one at a
      # time to keep the publisher from racing itself while creating that release.
      max-parallel: 1
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Sync version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION
          node -e "
            const fs = require('node:fs');
            const path = 'apps/desktop/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.version = process.env.VERSION;
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Import code signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -eo pipefail
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "MACOS_CERTIFICATE secret is not set"
            exit 1
          fi
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-temp-keychain-password}"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          # codesign resolves identities through the keychain search list, which
          # create-keychain does not join on its own.
          EXISTING_KEYCHAINS=$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')
          security list-keychains -d user -s build.keychain $EXISTING_KEYCHAINS
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          # Notarization can take tens of minutes; keep the keychain from relocking.
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning build.keychain

      - name: Build, sign, and notarize (${{ matrix.arch }})
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          pnpm --filter @yanshuf/mcp build
          pnpm --filter @yanshuf/desktop exec electron-forge publish --dry-run --arch=${{ matrix.arch }}

      - name: Verify signature and notarization
        run: |
          set -eo pipefail
          APP=$(find apps/desktop/out -maxdepth 2 -name 'Yanshuf.app' -print -quit)
          DMG=$(find apps/desktop/out/make -name '*.dmg' -print -quit)
          ZIP=$(find apps/desktop/out/make -name '*.zip' -print -quit)
          if [ -z "$APP" ] || [ -z "$DMG" ] || [ -z "$ZIP" ]; then
            echo "Could not locate the packaged app, DMG, or ZIP"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type exec -vv "$APP"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature -vv "$DMG"

      - name: Attach DMG to the draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @yanshuf/desktop exec electron-forge publish --from-dry-run

  finalize:
    # Flipping the draft is what makes the release visible to the in-app updater, so it
    # only happens once every architecture has been verified and uploaded.
    needs: [preflight, release]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest --repo "$GITHUB_REPOSITORY"
